name: Black Plate deployment check

on:
  pull_request:
    paths:
      - saguaros-license-plate/app/**
      - .vercelignore
      - .github/workflows/blackplate-deployment-check.yml
  push:
    branches: [main]
    paths:
      - saguaros-license-plate/app/**
      - .vercelignore
      - .github/workflows/blackplate-deployment-check.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saguaros-license-plate/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: saguaros-license-plate/app/package-lock.json
      - run: npm ci
      - name: Verify application source, build routes, and rendered homepage
        run: npm run build
